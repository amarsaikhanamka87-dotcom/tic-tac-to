<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./dom.css" />
  </head>
  <body>
    <header class="brand" aria-label="Tic Tac Toe">
      <div class="brand-mark" aria-hidden="true">
        <span class="mark-x">X</span><span class="mark-o">O</span>
      </div>
      <div class="brand-name">TIC <span>TAC</span> TOE</div>
    </header>
    <h1 class="winner"></h1>
    <div class="container">
      <div class="box">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="box">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="box">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <button class="reset">Reset</button>
    <script src="./index.js"></script>
  </body>
</html>
